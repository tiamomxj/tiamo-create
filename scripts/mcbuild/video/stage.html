<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>making-of stage</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;color:#f2f4f6}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#0d1117}
#view{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block;opacity:0}
.scene{position:absolute;inset:0;display:none;opacity:0}
.full{position:absolute;left:0;top:0;width:1920px;height:1080px}
.abs{position:absolute}
img.cover{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;transform-origin:50% 50%}
img.contain{position:absolute;object-fit:contain}
.darkbg{position:absolute;inset:0;background:radial-gradient(1400px 900px at 70% 30%,#1b2634 0%,#0f141b 60%,#0b0f14 100%)}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.card{position:absolute;background:rgba(250,248,244,.96);color:#1f2328;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.38);overflow:hidden}
.dcard{position:absolute;background:rgba(18,23,31,.9);color:#e7edf3;border-radius:18px;border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.mono{font-family:"Cascadia Mono","Cascadia Code",Consolas,monospace}
.chip{position:absolute;white-space:nowrap;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.95);color:#1f2328;font-size:30px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.3)}
.chip.dark{background:rgba(16,20,27,.88);color:#f1f4f7;border:1px solid rgba(255,255,255,.12)}
.tag{display:inline-block;padding:6px 16px;border-radius:999px;font-size:22px;font-weight:600;letter-spacing:.06em}
.h-label{font-size:24px;letter-spacing:.12em;color:#9fb0c0;font-weight:600}
.num{font-variant-numeric:tabular-nums}
#hud{position:absolute;inset:0;pointer-events:none;z-index:50}
#progress{position:absolute;left:0;top:0;height:5px;background:linear-gradient(90deg,#c99a5b,#e8c88f);width:0}
#chapter{position:absolute;left:56px;top:44px;padding:12px 26px;border-radius:999px;background:rgba(12,16,22,.72);border:1px solid rgba(255,255,255,.12);font-size:30px;font-weight:700;letter-spacing:.04em;opacity:0}
#sub{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);max-width:1700px;padding:14px 34px;border-radius:16px;background:rgba(8,10,14,.66);font-size:44px;font-weight:600;letter-spacing:.03em;line-height:1.35;text-align:center;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.5);opacity:0}
#brand{position:absolute;right:52px;top:50px;font-size:22px;letter-spacing:.18em;color:rgba(255,255,255,.55);font-weight:600}
#fade{position:absolute;inset:0;background:#000;opacity:0;z-index:60}
.check{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:#2fa36b;color:#fff;font-size:28px;font-weight:700;flex:none}
.row{display:flex;align-items:center;gap:22px}
.sw{width:54px;height:54px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" width="1920" height="1080"></canvas>
  <div id="layers"></div>
  <div id="hud"><div id="progress"></div><div id="chapter"></div><div id="brand"></div><div id="sub"></div></div>
  <div id="fade"></div>
</div>
<script src="timeline.js"></script>
<script src="data.js"></script>
<script src="../artifacts/preview/scene.js"></script>
<script src="../artifacts/preview/page.js"></script>
<script src="viewer.bundle.js"></script>
<script>document.getElementById('brand').textContent = (window.VIDEO_DATA || {}).brand || '';</script>
<script src="stage-lib.js"></script>
<script src="scenes.js"></script>
</body>
</html>
